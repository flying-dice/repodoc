name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned: `latest` makes every run depend on whatever Bun shipped
          # today, so a green PR can go red without a commit. Keep in step with
          # `packageManager` in package.json.
          bun-version: 1.3.11
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: bun install --frozen-lockfile
      - run: bun run check-types
      - run: bun run lint
      - run: bun test packages/core packages/cli packages/vscode/test/unit
      - run: xvfb-run -a bun run test:e2e
      - run: bun run vsix
      - uses: softprops/action-gh-release@v2
        with:
          files: 'packages/vscode/*.vsix'
          generate_release_notes: true
