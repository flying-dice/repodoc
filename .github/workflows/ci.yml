name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: bun install --frozen-lockfile
      - run: bun run check-types
      - run: bun run lint
      - run: bun test packages/core packages/cli packages/vscode/test/unit
      - run: xvfb-run -a bun run test:e2e
      - run: bun run vsix
      - uses: actions/upload-artifact@v4
        with:
          name: repodoc-vsix
          path: 'packages/vscode/*.vsix'
