name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned: `latest` makes every run depend on whatever Bun shipped
          # today, so a green PR can go red without a commit. Keep in step with
          # `packageManager` in package.json.
          bun-version: 1.3.11
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - uses: actions/cache@v4
        with:
          path: packages/vscode/.vscode-test/vscode-*
          key: vscode-test-${{ runner.os }}-${{ hashFiles('packages/vscode/package.json') }}
      - run: xvfb-run -a bun run test:e2e
      - run: bun run vsix
      - uses: actions/upload-artifact@v4
        with:
          name: repodoc-vsix
          path: 'packages/vscode/*.vsix'
